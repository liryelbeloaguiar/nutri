<header class="site-header">
  <div class="container header-inner">
    <a
      class="brand"
      href="#inicio"
      aria-label="Ricardo Mendes Nutrição — início"
      (click)="closeMenu()"
    >
      <span class="brand-mark" aria-hidden="true"><app-icon name="leaf" /></span>
      <span
        ><strong>{{ profile.shortName }}</strong
        ><small>Nutrição</small></span
      >
    </a>
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-navigation"
      aria-label="Abrir ou fechar menu"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
    <nav
      id="main-navigation"
      class="navigation"
      [class.open]="menuOpen()"
      aria-label="Navegação principal"
    >
      @for (item of navigation; track item.href) {
        <a [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
      }
      <a class="button button-primary header-cta" href="#contato" (click)="closeMenu()"
        >Agende uma consulta</a
      >
    </nav>
  </div>
</header>
